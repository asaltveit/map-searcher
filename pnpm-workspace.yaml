packages:
  - client
  - server-nest

# Reduce peak memory during lockfile regeneration (Renovate / pnpm install).
trustLockfile: true
networkConcurrency: 4

allowBuilds:
  '@nestjs/core': true
  '@prisma/engines': true
  '@scarf/scarf': false
  '@sentry/node-cpu-profiler': true
  esbuild: true
  msgpackr-extract: true
  prisma: true
  protobufjs: true
  sharp: true
  unrs-resolver: true
