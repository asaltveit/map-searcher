# Dependabot occasionally bumps workspace package.json without refreshing the root
# pnpm-lock.yaml, which breaks CI (--frozen-lockfile). Regenerate and push the lockfile.
name: Dependabot sync pnpm lockfile

on:
  pull_request:
    paths:
      - "pnpm-workspace.yaml"
      - "**/package.json"

concurrency:
  group: dependabot-lockfile-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  sync-lockfile:
    if: github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v6
        with:
          node-version: 20

      - uses: pnpm/action-setup@v6

      - name: Regenerate pnpm-lock.yaml
        run: pnpm install --lockfile-only

      - name: Commit and push if lockfile changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [[ -n $(git status --porcelain pnpm-lock.yaml) ]]; then
            git add pnpm-lock.yaml
            git commit -m "chore(deps): sync pnpm-lock.yaml"
            git push
          fi
